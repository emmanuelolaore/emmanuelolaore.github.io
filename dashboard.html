<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | Stallwise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="nav"><div class="wrap">
  <a class="logo" href="index.html"><i></i>Stallwise</a>
  <nav aria-label="Main"><ul>
    <li><a class="link" href="index.html">Overview</a></li>
    <li><a class="link" href="dashboard.html" aria-current="page">Live demo</a></li>
    <li><a class="link" href="pricing.html">Pricing</a></li>
    <li class="hide-s"><a class="btn sm" href="pricing.html#start">Start free</a></li>
  </ul></nav>
</div></header>

<div class="app">
  <nav class="side" aria-label="Dashboard">
    <a href="dashboard.html" aria-current="true">Sales</a>
    <a href="#products-card">Products</a>
    <a href="#stock-card">Stock alerts</a>
    <h4>Demo data</h4>
    <a href="pricing.html#start">Use my own shop</a>
  </nav>

  <main id="main" class="main">
    <div class="main-head">
      <div><h1>Sales</h1><div style="color:var(--muted)">Adaeze Provisions &middot; <span data-rangelabel>Last 30 days</span></div></div>
      <div class="seg" data-range role="group" aria-label="Date range">
        <button type="button" data-n="7" aria-pressed="false">7 days</button>
        <button type="button" data-n="30" aria-pressed="true">30 days</button>
        <button type="button" data-n="90" aria-pressed="false">90 days</button>
      </div>
    </div>

    <div class="kpis4" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi" data-kpi="rev"><span>Revenue</span><b class="v"></b><div class="d"></div></div>
      <div class="kpi" data-kpi="ord"><span>Orders</span><b class="v"></b><div class="d"></div></div>
      <div class="kpi" data-kpi="aov"><span>Average basket</span><b class="v"></b><div class="d"></div></div>
    </div>

    <div class="two">
      <section class="panel card" aria-labelledby="rev-h">
        <h2 id="rev-h">Daily revenue</h2>
        <div class="chartbox" data-chart></div>
      </section>
      <section class="panel card" id="stock-card" aria-labelledby="stock-h">
        <h2 id="stock-h">Stock alerts (<span id="alert-count">0</span>)</h2>
        <ul class="alerts" id="alerts"></ul>
      </section>
    </div>

    <section class="panel card" id="products-card" aria-labelledby="prod-h">
      <h2 id="prod-h">Top products</h2>
      <div class="tbl-wrap">
        <table>
          <thead><tr id="products-head">
            <th scope="col" aria-sort="none"><button type="button" data-k="n">Product</button></th>
            <th scope="col" class="num" aria-sort="none"><button type="button" data-k="u">Units sold</button></th>
            <th scope="col" class="num" aria-sort="descending"><button type="button" data-k="r">Revenue</button></th>
            <th scope="col"><span style="font-size:.85rem;font-weight:600;color:var(--muted)">Share of top seller</span></th>
          </tr></thead>
          <tbody id="products-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
